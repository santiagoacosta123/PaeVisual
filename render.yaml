services:
  - type: web
    name: paevisual-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist/paevisual/browser
    envVars:
      - key: NODE_VERSION
        value: "22.22.3"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
