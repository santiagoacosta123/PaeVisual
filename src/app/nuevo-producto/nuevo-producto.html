<div class="max-w-2xl font-sans">
  <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-xs flex flex-col gap-5">
    
    <!-- Encabezado -->
    <div class="border-b border-slate-100 pb-3.5">
      <h3 class="text-base font-bold text-slate-900 m-0">Registrar Nuevo Producto</h3>
      <p class="text-xs text-slate-500 m-0">Ingrese los detalles del nuevo insumo o producto para el inventario.</p>
    </div>

    <!-- Campos -->
    <div class="flex flex-col gap-4 text-xs">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Nombre del Producto *</label>
          <input [(ngModel)]="producto.nombre" type="text" placeholder="Ej. Arroz Diana" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-900 outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Categoría *</label>
          <input [(ngModel)]="producto.categoria" type="text" placeholder="Ej. Granos y Cereales" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-900 outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500">
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Cantidad en Stock</label>
          <input [(ngModel)]="producto.stock" type="number" placeholder="0" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-900 outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500">
        </div>
        <div>
          <label class="block font-semibold text-slate-700 mb-1.5">Precio / Valor Unitario</label>
          <input [(ngModel)]="producto.precio" type="number" placeholder="0" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs text-slate-900 outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500">
        </div>
      </div>
    </div>

    <!-- Pie / Botones -->
    <div class="flex justify-end gap-2.5 border-t border-slate-100 pt-4">
      <a routerLink="/productos" (click)="cancelar()" class="bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-semibold px-4 py-2 rounded-xl text-xs transition cursor-pointer">
        Cancelar
      </a>
      <button type="button" (click)="guardarProducto()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-5 py-2 rounded-xl text-xs transition cursor-pointer shadow-2xs">
        Guardar Producto
      </button>
    </div>

  </div>
</div>
