<div class="bg-white p-8 rounded-[16px] shadow max-w-3xl">
  <h2 class="font-black text-2xl mb-6">Registrar nuevo producto</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <input [(ngModel)]="producto.nombre" class="border p-3 rounded-[16px]" placeholder="Nombre del producto">
    <input [(ngModel)]="producto.categoria" class="border p-3 rounded-[16px]" placeholder="Categoría">
    <input type="number" [(ngModel)]="producto.stock" class="border p-3 rounded-[16px]" placeholder="Stock">
    <input type="number" [(ngModel)]="producto.precio" class="border p-3 rounded-[16px]" placeholder="Precio">
  </div>

  <div class="flex justify-end gap-3 mt-6">
    <a routerLink="/productos" (click)="cancelar()" class="px-6 py-2 rounded-[16px] border">Cancelar</a>
    <button type="button" (click)="guardarProducto()" class="bg-[#FAB41F] font-black px-8 py-2 rounded-[16px]">Guardar</button>
  </div>
</div>
