<div class="flex h-screen w-screen overflow-hidden font-sans">
  
  <div class="flex-1 flex justify-center items-center bg-white p-8">
    <div class="w-full max-w-md">
      
      <div class="mb-6 text-left">
        <img src="/sirae-logo.png" alt="Logo SIRAE" class="h-12 w-auto" />
      </div>
      
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Bienvenido de nuevo</h1>
        <p class="text-sm text-gray-500 m-0">Ingresa tus credenciales para acceder al sistema.</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        
        <div class="flex flex-col">
          <label for="correo" class="text-xs font-semibold text-gray-700 mb-2">Correo institucional</label>
          <div class="relative flex items-center">
            <input 
              id="correo" 
              type="email" 
              formControlName="correo" 
              placeholder="usuario@correo.com" 
              autocomplete="email"
              class="w-full px-3.5 py-3 text-sm border border-gray-300 rounded-lg outline-none bg-gray-50 focus:border-green-600 focus:bg-white focus:ring-2 focus:ring-green-600/10 transition-all"
            />
          </div>
          <span class="text-xs text-red-500 mt-1" *ngIf="correo?.invalid && (correo?.dirty || correo?.touched)">
            Ingresa un correo válido
          </span>
        </div>

        <div class="flex flex-col">
          <label for="clave" class="text-xs font-semibold text-gray-700 mb-2">Contraseña</label>
          <div class="relative flex items-center">
            <input 
              id="clave" 
              [type]="mostrarClave ? 'text' : 'password'" 
              formControlName="clave" 
              placeholder="••••••••" 
              class="w-full px-3.5 py-3 text-sm border border-gray-300 rounded-lg outline-none bg-gray-50 focus:border-green-600 focus:bg-white focus:ring-2 focus:ring-green-600/10 transition-all"
            />
            <button 
              type="button" 
              class="absolute right-3 bg-transparent border-none cursor-pointer text-gray-500 hover:text-gray-800 flex items-center justify-center p-0"
              (click)="alternarClave()"
              tabindex="-1"
              aria-label="Alternar visibilidad de contraseña"
            >
              <svg *ngIf="!mostrarClave" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg *ngIf="mostrarClave" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
          <span class="text-xs text-red-500 mt-1" *ngIf="clave?.invalid && (clave?.dirty || clave?.touched)">
            Mínimo 6 caracteres
          </span>
        </div>

        <div class="bg-red-50 text-red-700 px-4 py-2.5 rounded-md text-xs mb-4 border border-red-200 text-center" *ngIf="errorMensaje">
          {{ errorMensaje }}
        </div>

        <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg transition-colors cursor-pointer disabled:bg-teal-200 disabled:cursor-not-allowed mt-2" [disabled]="cargando">
          <span *ngIf="!cargando">Ingresar al sistema</span>
          <span *ngIf="cargando" class="inline-block">Verificando...</span>
        </button>

      </form>
    </div>
  </div>

  <div class="hidden md:flex flex-1 bg-gray-100 justify-center items-center p-8">
    <img src="/vegetales-frame.png" alt="Vegetales SIRAE" class="w-full h-full object-cover rounded-2xl" />
  </div>

</div>
