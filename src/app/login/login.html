<div class="flex h-screen w-screen items-center justify-center font-sans relative overflow-hidden" style="background-color: #fdfaf2;">

  <!-- Fondo Premium: Patrón sutil y degradados dinámicos -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-amber-200/40 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-[#fac94b]/20 rounded-full blur-[150px]"></div>
    <!-- Opcional: ruido o textura sutil -->
    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.03]"></div>
  </div>

  <style>
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
    }
  </style>

  <div class="w-full max-w-6xl mx-auto px-6 md:px-12 flex flex-col md:flex-row items-center justify-between relative z-10 gap-12 md:gap-8">

    <!-- Lado izquierdo: Logo y Branding -->
    <div class="w-full md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left drop-shadow-sm md:pl-8">
      
      <img src="/sirae-logo.png" alt="Logo SIRAE" class="w-full max-w-[240px] md:max-w-[280px] h-auto mb-6 transition-transform hover:scale-105 duration-500" />

      <h2 style="font-family: 'Playfair Display', serif;" class="text-[20px] sm:text-[24px] md:text-[26px] lg:text-[30px] text-[#1f2937] font-extrabold mb-5 tracking-tight leading-tight whitespace-nowrap">
        Programa de Alimentación Escolar
      </h2>

      <div class="flex items-center justify-center md:justify-start gap-4">
        <div class="w-12 h-[2px] bg-[#fac94b] rounded-full"></div>
        <p style="font-family: 'Playfair Display', serif;" class="text-[#fac94b] text-[18px] md:text-[20px] font-medium tracking-wide italic">
          Alimentando cada día
        </p>
        <div class="w-12 h-[2px] bg-[#fac94b] rounded-full"></div>
      </div>
    </div>

    <!-- Lado derecho: Tarjeta de Login (Efecto Glass/Premium) -->
    <div class="w-full md:w-1/2 flex justify-center md:justify-end">
      
      <div class="w-full max-w-[440px] bg-white/90 backdrop-blur-xl rounded-[2.5rem] shadow-[0_20px_60px_rgba(250,201,75,0.12)] p-10 md:p-12 border border-white relative overflow-hidden">
        
        <!-- Reflejo superior sutil -->
        <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-[#fac94b] to-transparent opacity-50"></div>

        <!-- Encabezado -->
        <div class="mb-10 text-center relative z-10">
          <h1 style="font-family: 'Playfair Display', serif;" class="text-4xl md:text-5xl font-bold text-[#1a1a1a] mb-3 tracking-tight italic">
            ¡Bienvenido!
          </h1>
          <p class="text-[14.5px] text-slate-500 font-medium">
            Ingresa tus credenciales para continuar.
          </p>
        </div>

        <!-- Formulario -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5 w-full relative z-10">

          <!-- Correo electrónico -->
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#fac94b] transition-colors z-10">
              <span class="material-symbols-outlined text-[22px]">mail</span>
            </div>

            <input id="correo" type="email" formControlName="correo" placeholder="Correo electrónico" autocomplete="email"
              class="w-full pl-14 pr-5 py-4 text-[15px] bg-[#f8fafc] border border-slate-100 rounded-2xl outline-none text-[#1a1a1a] focus:bg-white focus:border-[#fac94b] focus:ring-4 focus:ring-[#fac94b]/15 transition-all placeholder-slate-400 font-medium shadow-inner" />
          </div>

          <span class="text-[11.5px] text-red-500 font-medium block pl-2 -mt-3"
            *ngIf="correo?.invalid && (correo?.dirty || correo?.touched)">
            Ingresa un correo válido
          </span>

          <!-- Contraseña -->
          <div class="relative group">
            <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-[#fac94b] transition-colors z-10">
              <span class="material-symbols-outlined text-[22px]">lock</span>
            </div>

            <input id="clave" [type]="mostrarClave ? 'text' : 'password'" formControlName="clave" placeholder="Contraseña"
              autocomplete="current-password"
              class="w-full pl-14 pr-12 py-4 text-[15px] bg-[#f8fafc] border border-slate-100 rounded-2xl outline-none text-[#1a1a1a] focus:bg-white focus:border-[#fac94b] focus:ring-4 focus:ring-[#fac94b]/15 transition-all placeholder-slate-400 font-medium shadow-inner" />

            <!-- Mostrar u ocultar contraseña -->
            <button type="button"
              class="absolute inset-y-0 right-0 pr-5 flex items-center text-slate-400 hover:text-[#fac94b] focus:outline-none z-10 cursor-pointer transition-colors"
              (click)="alternarClave()" aria-label="Mostrar u ocultar contraseña">
              <span class="material-symbols-outlined text-[20px]">{{ mostrarClave ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>

          <span class="text-[11.5px] text-red-500 font-medium block pl-2 -mt-3" *ngIf="clave?.invalid && (clave?.dirty || clave?.touched)">
            Mínimo 6 caracteres
          </span>

          <!-- Recuperar contraseña -->
          <div class="flex justify-end pb-2">
            <button type="button" (click)="abrirModalRecuperar()"
              class="text-[13px] text-slate-500 font-medium hover:text-[#b18a00] transition-colors focus:outline-none cursor-pointer">
              ¿Olvidaste tu contraseña?
            </button>
          </div>

          <!-- Mensaje de error -->
          <div class="bg-red-50 text-red-700 px-4 py-3 rounded-2xl text-[13px] mb-4 border border-red-100 text-center font-medium shadow-sm"
            *ngIf="errorMensaje">
            {{ errorMensaje }}
          </div>

          <!-- Botón de inicio de sesión -->
          <button type="submit"
            class="w-full py-4 bg-gradient-to-r from-[#fac94b] to-[#f4b316] hover:from-[#f5b927] hover:to-[#e5a00d] text-[#1a1a1a] font-bold text-[15.5px] rounded-2xl shadow-[0_8px_20px_rgba(250,201,75,0.35)] hover:shadow-[0_10px_25px_rgba(250,201,75,0.45)] hover:-translate-y-[2px] transition-all duration-300 cursor-pointer disabled:opacity-50 flex items-center justify-center mt-6"
            [disabled]="cargando">

            <span *ngIf="!cargando" class="tracking-wide">
              Iniciar Sesión
            </span>
            <span *ngIf="cargando" class="tracking-wide">
              Verificando...
            </span>
          </button>

        </form>

        <!-- Mensaje de seguridad -->
        <div class="mt-8 text-center text-[12px] text-slate-400 font-medium flex items-center justify-center gap-1.5">
          <span class="material-symbols-outlined text-[16px]">verified_user</span>
          Acceso seguro y encriptado
        </div>

      </div>
    </div>
  </div>
</div>
