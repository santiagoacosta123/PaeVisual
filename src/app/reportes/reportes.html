<div class="space-y-6">
  <h1 class="text-2xl font-black">Reportes</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
    <div class="bg-white rounded-[16px] shadow p-5">
      <p class="text-sm text-slate-500">Inventario total</p>
      <h2 class="text-3xl font-black mt-2">1,284</h2>
    </div>
    <div class="bg-white rounded-[16px] shadow p-5">
      <p class="text-sm text-slate-500">Movimientos</p>
      <h2 class="text-3xl font-black mt-2">312</h2>
    </div>
    <div class="bg-white rounded-[16px] shadow p-5">
      <p class="text-sm text-slate-500">Alertas</p>
      <h2 class="text-3xl font-black mt-2">07</h2>
    </div>
  </div>

  <div class="bg-white rounded-[16px] shadow p-6">
    <div class="flex justify-between items-center">
      <h3 class="text-lg font-bold">Resumen ejecutivo</h3>
      <div class="flex gap-2">
        <button type="button" (click)="exportarReporte()" class="bg-[#FAB41F] px-4 py-2 rounded-[16px] font-bold text-slate-900">Exportar</button>
        <button type="button" (click)="enviarReporte()" class="border px-4 py-2 rounded-[16px]">Enviar</button>
      </div>
    </div>
  </div>
</div>
