<div class="flex flex-col gap-6 relative" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">

  <!-- ===================== CABECERA PRINCIPAL ===================== -->
  <header class="w-full flex flex-col sm:flex-row sm:items-center justify-between gap-5 px-6 py-5 rounded-xl border border-[#f2ead0] sticky top-[-24px] z-20 shadow-xs"
    style="background: linear-gradient(135deg, #fffcf0 0%, #ffffff 100%);">
    <div class="flex items-center gap-4">
      <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full border border-amber-200 bg-amber-50 text-amber-700 shadow-xs">
        <span class="material-symbols-outlined text-[26px]">dashboard</span>
      </div>
      <div>
        <h1 class="m-0 text-xl font-bold tracking-tight text-slate-900">¡Bienvenido, {{ nombreUsuario }}!</h1>
        <p class="m-0 mt-0.5 text-slate-500 text-[13px]">{{ rolUsuario }} · Centro de operaciones y gestión central del programa PAE.</p>
      </div>
    </div>

    <div class="flex items-center gap-3 flex-wrap">
      <div class="flex items-center gap-2 bg-white border border-slate-200 rounded-full px-4 py-2 shadow-xs text-[12.5px] text-slate-700 font-semibold">
        <span class="material-symbols-outlined text-[16px] text-amber-600">calendar_today</span>
        <span>{{ fechaActual }}</span>
      </div>

      <!-- Botón exclusivo para Super Administrador -->
      <a *ngIf="esSuperAdministrador" routerLink="/contratos" class="h-[38px] px-5 inline-flex items-center justify-center gap-2 border-none rounded-full bg-[#fac94b] text-slate-900 text-[13px] font-bold cursor-pointer whitespace-nowrap shadow-[0_2px_8px_rgba(251,191,36,0.28)] transition-all hover:bg-[#f59e0b] no-underline">
        <span>Gestión de Contratos</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </a>

      <!-- Botón exclusivo para Administrador -->
      <a *ngIf="esAdministrador" routerLink="/ingredientes" class="h-[38px] px-5 inline-flex items-center justify-center gap-2 border-none rounded-full bg-[#fac94b] text-slate-900 text-[13px] font-bold cursor-pointer whitespace-nowrap shadow-[0_2px_8px_rgba(251,191,36,0.28)] transition-all hover:bg-[#f59e0b] no-underline">
        <span>Ir a Inventario</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </a>
    </div>
  </header>

</div>
