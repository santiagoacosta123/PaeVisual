<div class="inicio-container">


  <div class="welcome-banner">
    <div class="welcome-text-content">
      <h2 class="welcome-title">Bienvenido<br>{{ nombreUsuario }}</h2>
      <p class="welcome-subtitle">Panel de control de sistema</p>
      <span class="welcome-date">{{ fechaActual }}</span>
    </div>
    <div class="welcome-image-content">
      <img src="administrador.png" alt="Administrador" class="admin-illustration" />
    </div>
  </div>


  <div class="metrics-grid">
    <div class="metric-card" *ngFor="let item of resumen"                                         >
      <span class="metric-card-title">{{ item.titulo }}</span>
      <h3 class="metric-card-value">{{ item.valor }}</h3>
      <span class="metric-card-desc">{{ item.desc }}</span>
      <a [routerLink]="[item.ruta]" class="metric-action-btn">{{ item.btnTexto }}</a>
    </div>
  </div>

</div>
