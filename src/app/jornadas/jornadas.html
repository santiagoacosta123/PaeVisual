<div class="min-h-screen bg-gray-100 p-6 md:p-10">
  <div class="max-w-5xl mx-auto space-y-6">

  <!-- TEXTO ARRIBA QUE DICE JORNADA -->
  <div class="flex items-center justify-between pb-2 border-b border-amber-200/70">
    <h1 class="text-3xl font-black tracking-tight text-slate-900">
      Jornada
    </h1>

    <button
      type="button"
      (click)="iniciarCreacion()"
      class="bg-[#FAB41F] hover:bg-[#e09e15] active:scale-95 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-1.5 cursor-pointer"
    >
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
      </svg>
      Nueva Jornada
    </button>
  </div>

  <!-- TABLA -->
  <div class="bg-white rounded-2xl shadow-sm border border-amber-200/80 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <!-- ENCABEZADO AMARILLO INSTITUCIONAL -->
        <thead class="bg-[#FAB41F] text-slate-900 font-black uppercase text-xs tracking-wider">
          <tr>
            <th class="px-6 py-4 w-28">ID</th>
            <th class="px-6 py-4">Nombre de la jornada</th>
            <th class="px-6 py-4 text-center w-56">Acciones</th>
          </tr>
        </thead>

        <tbody class="divide-y divide-slate-100 text-sm">
          <!-- FILA INLINE PARA CREAR NUEVA JORNADA -->
          <tr *ngIf="creandoNuevo" class="bg-amber-50 border-b border-amber-200">
            <td class="px-6 py-3 font-semibold text-amber-800">
              <span class="bg-amber-200/70 text-amber-900 px-2.5 py-1 rounded-lg text-xs font-bold">
                Nuevo
              </span>
            </td>
            <td class="px-6 py-3">
              <input
                type="text"
                [(ngModel)]="nuevoNombre"
                placeholder="Escribe el nombre de la jornada..."
                class="w-full px-3 py-1.5 rounded-lg border border-amber-300 bg-white outline-none focus:ring-2 focus:ring-[#FAB41F]"
                (keyup.enter)="guardarNuevaJornada()"
                autofocus
              />
            </td>
            <td class="px-6 py-3 text-center">
              <div class="inline-flex items-center gap-2">
                <button
                  type="button"
                  (click)="guardarNuevaJornada()"
                  class="bg-[#FAB41F] hover:bg-[#e09e15] text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer shadow-xs"
                >
                  Guardar
                </button>
                <button
                  type="button"
                  (click)="cancelarCreacion()"
                  class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-1.5 rounded-lg text-xs cursor-pointer"
                >
                  Cancelar
                </button>
              </div>
            </td>
          </tr>

          <!-- FILAS DE JORNADAS -->
          <tr
            *ngFor="let jornada of jornadas"
            class="hover:bg-amber-50/40 transition-colors"
          >
            <!-- ID -->
            <td class="px-6 py-4 font-semibold text-slate-500">
              <span class="bg-amber-100 text-amber-900 px-2.5 py-1 rounded-lg text-xs font-bold border border-amber-200">
                #{{ jornada.id_jornada }}
              </span>
            </td>

            <!-- NOMBRE DE JORNADA O EDICIÓN INLINE -->
            <td class="px-6 py-4 font-bold text-slate-800">
              <div *ngIf="idEditando !== jornada.id_jornada" class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-[#FAB41F]"></span>
                {{ jornada.nombre_jornada }}
              </div>

              <input
                *ngIf="idEditando === jornada.id_jornada"
                type="text"
                [(ngModel)]="nombre_jornada"
                class="w-full px-3 py-1.5 rounded-lg border border-amber-300 bg-white outline-none focus:ring-2 focus:ring-[#FAB41F]"
                (keyup.enter)="actualizarJornada()"
                autofocus
              />
            </td>

            <!-- ACCIONES: BOTONES EDITAR (AMARILLO) Y ELIMINAR (ROJO) -->
            <td class="px-6 py-4 text-center">
              <!-- MODO VISUALIZACIÓN -->
              <div *ngIf="idEditando !== jornada.id_jornada" class="inline-flex items-center gap-2">
                <!-- EDITAR -->
                <button
                  type="button"
                  (click)="editarJornada(jornada)"
                  title="Editar esta jornada"
                  class="bg-[#FAB41F] hover:bg-[#e09e15] active:scale-95 text-slate-900 font-bold px-3.5 py-1.5 rounded-xl shadow-xs hover:shadow transition-all inline-flex items-center gap-1.5 text-xs cursor-pointer"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                  </svg>
                  Editar
                </button>

                <!-- ELIMINAR -->
                <button
                  type="button"
                  (click)="eliminarJornada(jornada.id_jornada!)"
                  title="Eliminar esta jornada"
                  class="bg-red-500 hover:bg-red-600 active:scale-95 text-white font-bold px-3.5 py-1.5 rounded-xl shadow-xs hover:shadow transition-all inline-flex items-center gap-1.5 text-xs cursor-pointer"
                >
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                  Eliminar
                </button>
              </div>

              <!-- MODO EDICIÓN -->
              <div *ngIf="idEditando === jornada.id_jornada" class="inline-flex items-center gap-2">
                <button
                  type="button"
                  (click)="actualizarJornada()"
                  class="bg-[#FAB41F] hover:bg-[#e09e15] text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs cursor-pointer shadow-xs"
                >
                  Guardar
                </button>
                <button
                  type="button"
                  (click)="cancelarEdicion()"
                  class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-1.5 rounded-lg text-xs cursor-pointer"
                >
                  Cancelar
                </button>
              </div>
            </td>
          </tr>

          <!-- SIN JORNADAS -->
          <tr *ngIf="jornadas.length === 0 && !creandoNuevo">
            <td colspan="3" class="px-6 py-12 text-center text-slate-400 bg-slate-50/50">
              No hay jornadas registradas.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>
</div>
