<div style="display: flex; flex-direction: column; gap: 20px;">
  
  <!-- Cabecera de la sección -->
  <div style="display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #e0e0e0;">
    <div>
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #1a1a1a;">Gestión de Notificaciones</h2>
      <p style="margin: 4px 0 0 0; font-size: 13px; color: #666;">Crea, edita o administra las alertas del sistema.</p>
    </div>
    <button type="button" (click)="abrirModalCrear()"
      style="background: #e0a316; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px;">
      <span class="material-symbols-outlined" style="font-size: 18px;">add</span>
      Nueva Notificación
    </button>
  </div>

  <!-- Tabla de Datos -->
  <div style="background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
      <thead>
        <tr style="background: #fafafa; border-bottom: 1px solid #eee; color: #555;">
          <th style="padding: 14px 16px;">Título</th>
          <th style="padding: 14px 16px;">Mensaje</th>
          <th style="padding: 14px 16px;">Estado</th>
          <th style="padding: 14px 16px; text-align: right;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="listaNotificaciones.length === 0">
          <td colspan="4" style="padding: 30px; text-align: center; color: #888;">No hay notificaciones registradas.</td>
        </tr>
        <tr *ngFor="let noti of listaNotificaciones" style="border-bottom: 1px solid #f2f2f2;">
          <td style="padding: 14px 16px; font-weight: 600; color: #333;">{{ noti.titulo }}</td>
          <td style="padding: 14px 16px; color: #666; max-width: 350px;">{{ noti.mensaje }}</td>
          <td style="padding: 14px 16px;">
            <span [style.background]="noti.leida ? '#e8f5e9' : '#fff8e1'"
                  [style.color]="noti.leida ? '#2e7d32' : '#f57f17'"
                  style="padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;">
              {{ noti.leida ? 'Leída' : 'No leída' }}
            </span>
          </td>
          <td style="padding: 14px 16px; text-align: right; display: flex; gap: 8px; justify-content: flex-end;">
            <button type="button" (click)="marcarLeida(noti.id)" style="background: #e8f5e9; border: none; padding: 6px; border-radius: 6px; cursor: pointer;" title="Marcar como leída">
              <span class="material-symbols-outlined" style="font-size: 16px; color: #2e7d32;">check</span>
            </button>
            <button type="button" (click)="abrirModalEditar(noti)" style="background: #f0f4f8; border: none; padding: 6px; border-radius: 6px; cursor: pointer;" title="Editar">
              <span class="material-symbols-outlined" style="font-size: 16px; color: #555;">edit</span>
            </button>
            <button type="button" (click)="eliminar(noti.id)" style="background: #fde8e8; border: none; padding: 6px; border-radius: 6px; cursor: pointer;" title="Eliminar">
              <span class="material-symbols-outlined" style="font-size: 16px; color: #d32f2f;">delete</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para Crear / Editar -->
  <div *ngIf="mostrarModal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 200;">
    <div style="background: #fff; width: 450px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);">
      <h3 style="margin: 0 0 16px 0; font-size: 18px; color: #333;">{{ modoEdicion ? 'Editar Notificación' : 'Nueva Notificación' }}</h3>
      
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 600; color: #555;">Título</label>
          <input type="text" [(ngModel)]="notificacionForm.titulo" placeholder="Ej. Alerta de Stock" style="padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none;" />
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 12px; font-weight: 600; color: #555;">Mensaje</label>
          <textarea [(ngModel)]="notificacionForm.mensaje" placeholder="Escribe el contenido detallado..." rows="3" style="padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; resize: none;"></textarea>
        </div>

        <div *ngIf="modoEdicion" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" [(ngModel)]="notificacionForm.leida" id="leidaCheck" style="width: 16px; height: 16px;" />
          <label for="leidaCheck" style="font-size: 13px; color: #333; cursor: pointer;">Marcar como leída</label>
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
        <button type="button" (click)="cerrarModal()" style="background: #f1f1f1; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; color: #555;">Cancelar</button>
        <button type="button" (click)="guardarNotificacion()" style="background: #e0a316; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer;">Guardar</button>
      </div>
    </div>
  </div>

</div>
