<h1 class="font-black text-2xl mb-4">Roles</h1>

<div class="bg-white p-6 rounded-[16px] shadow mb-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-black">{{ modoEdicion ? 'Actualizar rol' : 'Registrar rol' }}</h2>
    <button *ngIf="modoEdicion" type="button" (click)="abrirFormulario()" class="border px-3 py-1 rounded-lg text-sm">Cancelar</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <input [(ngModel)]="rolForm.nombre" class="border p-3 rounded-[16px]" placeholder="Nombre del rol">
    <input [(ngModel)]="rolForm.descripcion" class="border p-3 rounded-[16px]" placeholder="Descripción">
    <select [(ngModel)]="rolForm.estado" class="border p-3 rounded-[16px]">
      <option value="Activo">Activo</option>
      <option value="Inactivo">Inactivo</option>
    </select>
  </div>

  <div class="flex justify-end mt-4">
    <button type="button" (click)="guardarRol()" class="bg-[#FAB41F] px-6 py-2 rounded-[16px] font-bold text-slate-900">
      {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="bg-white rounded-[16px] shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-[#FAB41F] font-bold">
      <tr>
        <th class="p-4 text-left">Rol</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles" class="border-t">
        <td class="p-4">{{ rol.nombre }}</td>
        <td>{{ rol.descripcion }}</td>
        <td>
          <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full">{{ rol.estado }}</span>
        </td>
        <td class="p-4">
          <div class="flex gap-2">
            <button type="button" (click)="editarRol(rol)" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold">✏️ Editar</button>
            <button type="button" (click)="eliminarRol(rol)" class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-600">🗑️ Eliminar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
