<div class="max-w-5xl mx-auto">
  <h1 class="text-2xl font-black mb-4">Sedes</h1>

  <div class="bg-white p-6 rounded-[16px] shadow mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-black">{{ modoEdicion ? 'Actualizar sede' : 'Registrar sede' }}</h2>
      <button *ngIf="modoEdicion" type="button" (click)="abrirFormulario()" class="border px-3 py-1 rounded-lg text-sm">Cancelar</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input [(ngModel)]="sedeForm.nombre" class="border p-3 rounded-[16px]" placeholder="Nombre de la sede">
      <input [(ngModel)]="sedeForm.direccion" class="border p-3 rounded-[16px]" placeholder="Dirección">
      <select [(ngModel)]="sedeForm.estado" class="border p-3 rounded-[16px]">
        <option value="Activa">Activa</option>
        <option value="Inactiva">Inactiva</option>
      </select>
    </div>

    <div class="flex justify-end mt-4">
      <button type="button" (click)="guardarSede()" class="bg-[#FAB41F] px-6 py-2 rounded-[16px] font-bold text-slate-900">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </div>

  <div class="bg-white rounded-[16px] shadow overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-[#FAB41F] font-bold">
        <tr>
          <th class="p-4 text-left">Sede</th>
          <th>Dirección</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sede of sedes" class="border-t">
          <td class="p-4">{{ sede.nombre }}</td>
          <td>{{ sede.direccion }}</td>
          <td>
            <span [ngClass]="sede.estado === 'Activa' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="px-3 py-1 rounded-full">{{ sede.estado }}</span>
          </td>
          <td class="p-4">
            <div class="flex gap-2">
              <button type="button" (click)="editarSede(sede)" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold">✏️ Editar</button>
              <button type="button" (click)="eliminarSede(sede)" class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-600">🗑️ Eliminar</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
