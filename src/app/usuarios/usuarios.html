<div class="usuarios-container">
  
  <!-- BARRA DE ACCIÓN Y FILTROS -->
  <div class="action-bar">
    <div class="filter-tabs">
      <button 
        type="button" 
        class="filter-btn" 
        [class.active]="filtroActual === 'todos'" 
        (click)="filtrar('todos')">
        Todos
      </button>
      <button 
        type="button" 
        class="filter-btn" 
        [class.active]="filtroActual === 'Activo'" 
        (click)="filtrar('Activo')">
        Activos
      </button>
      <button 
        type="button" 
        class="filter-btn" 
        [class.active]="filtroActual === 'Inactivo'" 
        (click)="filtrar('Inactivo')">
        Inactivos
      </button>
    </div>
  </div>

  <!-- FORMULARIO DE REGISTRO / EDICIÓN -->
  <div class="card-form-container">
    <div class="form-header">
      <h3 class="form-title">{{ modoEdicion ? 'Editar usuario' : 'Registrar usuario' }}</h3>
      <p class="form-subtitle">Complete los campos para añadir o modificar un miembro en el sistema.</p>
    </div>
    
    <div class="form-grid">
      <!-- Input de Nombre -->
      <div class="input-group">
        <input 
          type="text" 
          [(ngModel)]="usuarioForm.nombre" 
          placeholder="Nombre completo" 
          class="form-input" 
        />
      </div>
      
      <!-- Selector de Rol -->
      <div class="input-group">
        <select [(ngModel)]="usuarioForm.rol" class="form-input">
          <option value="" disabled selected>Seleccione el rol</option>
          <option value="Admin">Admin</option>
          <option value="Coordinador">Coordinador</option>
          <option value="Supervisor">Supervisor</option>
        </select>
      </div>

      <!-- Selector de Estado -->
      <div class="input-group">
        <select [(ngModel)]="usuarioForm.estado" class="form-input">
          <option value="" disabled selected>Estado inicial</option>
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>

      <!-- Botón Guardar / Actualizar -->
      <div class="form-action">
        <button type="button" class="btn-primary" (click)="guardarUsuario()">
          {{ modoEdicion ? 'Actualizar usuario' : 'Guardar usuario' }}
        </button>
      </div>
    </div>
  </div>

  <!-- TABLA DE USUARIOS -->
  <div class="table-card">
    <div class="table-header-title">
      <h4>Usuarios Registrados</h4>
    </div>
    <table class="custom-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Rol</th>
          <th>Estado</th>
          <th class="text-right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let usuario of usuariosFiltrados">
          <td class="font-medium">{{ usuario.nombre }}</td>
          <td><span class="role-text">{{ usuario.rol }}</span></td>
          <td>
            <span class="status-badge" [ngClass]="usuario.estado === 'Activo' ? 'active' : 'inactive'">
              {{ usuario.estado }}
            </span>
          </td>
          <td class="actions-cell">
            <button class="btn-action edit" (click)="editarUsuario(usuario)">Editar</button>
            <button class="btn-action delete" (click)="eliminarUsuario(usuario)">Eliminar</button>
          </td>
        </tr>
        <tr *ngIf="usuariosFiltrados.length === 0">
          <td colspan="4" style="padding: 24px; text-align: center; color: #64748b;">
            No hay usuarios registrados en esta categoría.
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
