<div class="flex justify-between mb-4">
  <div class="flex gap-2">
    <button class="bg-[#FAB41F] px-4 py-2 rounded-[16px] font-bold text-slate-900">Todos</button>
    <button class="bg-white border px-4 py-2 rounded-[16px]">Activos</button>
    <button class="bg-white border px-4 py-2 rounded-[16px]">Inactivo</button>
  </div>
  <a routerLink="/crear-usuario" class="bg-[#FAB41F] px-5 py-2 rounded-[16px] font-bold text-slate-900">+ Nuevo Usuario</a>
</div>

<div class="bg-white p-6 rounded-[16px] shadow mb-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-black">{{ modoEdicion ? 'Actualizar usuario' : 'Registrar usuario' }}</h2>
    <button *ngIf="modoEdicion" type="button" (click)="abrirFormulario()" class="border px-3 py-1 rounded-lg text-sm">Cancelar</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <input [(ngModel)]="usuarioForm.nombre" class="border p-3 rounded-[16px]" placeholder="Nombre completo">
    <select [(ngModel)]="usuarioForm.rol" class="border p-3 rounded-[16px]">
      <option value="Admin">Admin</option>
      <option value="Coordinador">Coordinador</option>
      <option value="Supervisor">Supervisor</option>
      <option value="Jefa">Jefa</option>
    </select>
    <select [(ngModel)]="usuarioForm.estado" class="border p-3 rounded-[16px]">
      <option value="Activo">Activo</option>
      <option value="Inactivo">Inactivo</option>
    </select>
  </div>

  <div class="flex justify-end mt-4">
    <button type="button" (click)="guardarUsuario()" class="bg-[#FAB41F] px-6 py-2 rounded-[16px] font-bold text-slate-900">
      {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="bg-white rounded-[16px] shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-[#FAB41F] font-bold">
      <tr>
        <th class="p-4 text-left">Nombre</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios" class="border-t">
        <td class="p-4">{{ usuario.nombre }}</td>
        <td>{{ usuario.rol }}</td>
        <td>
          <span [ngClass]="usuario.estado === 'Activo' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'" class="px-3 py-1 rounded-full">
            {{ usuario.estado }}
          </span>
        </td>
        <td class="p-4">
          <div class="flex gap-2">
            <button type="button" (click)="editarUsuario(usuario)" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold">✏️ Editar</button>
            <button type="button" (click)="eliminarUsuario(usuario)" class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-600">🗑️ Eliminar</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
