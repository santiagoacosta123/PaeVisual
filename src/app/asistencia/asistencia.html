<div style="background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:24px; font-family:'Roboto',sans-serif;">

  <!-- Encabezado del Módulo -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #eee; padding-bottom:15px;">
    <div>
      <h2 style="font-size:20px; font-weight:700; color:#333; margin:0;">Control de Asistencia Diaria</h2>
      <p style="font-size:13px; color:#777; margin:4px 0 0 0;">Gestión de la tabla asistencia_diaria vinculada a grados y manipulador jefe.</p>
    </div>
    <button type="button" (click)="guardarAsistencia()"
      style="background:#f4b41f; color:#333; font-weight:700; border:none; border-radius:6px; padding:10px 16px; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px;">
      <span class="material-symbols-outlined" style="font-size:18px;">save</span>
      Guardar en Base de Datos
    </button>
  </div>

  <!-- Barra de Filtros (Fecha y Grados) -->
  <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
    <div style="flex:1; min-width:200px;">
      <label style="font-size:12px; font-weight:600; color:#777; display:block; margin-bottom:4px;">Fecha</label>
      <input type="date" [(ngModel)]="fecha_registro"
        style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; box-sizing:border-box;" />
    </div>

    <div style="flex:1; min-width:200px;">
      <label style="font-size:12px; font-weight:600; color:#777; display:block; margin-bottom:4px;">Filtrar por Grado</label>
      <select [(ngModel)]="id_grado_seleccionado"
        style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; background:#fff; box-sizing:border-box;">
        <option value="todos">Todos los grados</option>
        <option *ngFor="let g of grados" [value]="g.id_grado">{{ g.nombre_grado }}</option>
      </select>
    </div>

    <div style="flex:2; min-width:250px;">
      <label style="font-size:12px; font-weight:600; color:#777; display:block; margin-bottom:4px;">Buscar Estudiante</label>
      <input type="text" [(ngModel)]="filtroBusqueda" placeholder="Escribe el nombre..."
        style="width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; box-sizing:border-box;" />
    </div>
  </div>

  <!-- Tabla que refleja asistencia_diaria -->
  <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; text-align:left; font-size:14px;">
      <thead>
        <tr style="background:#f9f9f9; border-bottom:2px solid #e0e0e0; color:#555;">
          <th style="padding:12px;">Estudiante (Nombre Completo)</th>
          <th style="padding:12px;">ID Grado</th>
          <th style="padding:12px; text-align:center;">Asistió / Presente</th>
          <th style="padding:12px; text-align:center;">Valor (ninos_presentes)</th>
          <th style="padding:12px;">Observaciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let est of estudiantesFiltrados" style="border-bottom:1px solid #eee;">
          <td style="padding:12px; font-weight:500; color:#333;">{{ est.nombre_completo }}</td>
          <td style="padding:12px; color:#555;">{{ est.id_grado }}</td>
          <td style="padding:12px; text-align:center;">
            <input type="checkbox" [checked]="est.asistio" (change)="toggleAsistencia(est)"
              style="width:18px; height:18px; cursor:pointer;" />
          </td>
          <td style="padding:12px; text-align:center; font-weight:bold; color:#2e7d32;">
            {{ est.ninos_presentes }}
          </td>
          <td style="padding:12px;">
            <input type="text" [(ngModel)]="est.observaciones" placeholder="Nota..."
              style="width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:4px; font-size:13px; outline:none; box-sizing:border-box;" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
