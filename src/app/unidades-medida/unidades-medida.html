<h1 class="font-black text-2xl mb-4">Unidades de Medida</h1>
<div class="bg-white p-6 rounded-[16px] shadow mb-6">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-black">
      {{ modoEdicion ? 'Actualizar unidad' : 'Registrar unidad' }}
    </h2>
    <button
      *ngIf="modoEdicion"
      type="button"
      (click)="cancelarEdicion()"
      class="border px-3 py-1 rounded-lg text-sm hover:bg-slate-50"
    >
      Cancelar
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <input
      [(ngModel)]="unidadForm.nombre_unidad"
      class="border p-3 rounded-[16px]"
      placeholder="Nombre de la unidad (ej: Kilogramo)"
    />
    <input
      [(ngModel)]="unidadForm.abreviatura"
      class="border p-3 rounded-[16px]"
      placeholder="Abreviatura (ej: kg)"
    />
  </div>

  <div class="flex justify-end mt-4">
    <button
      type="button"
      (click)="guardarUnidad()"
      class="bg-[#FAB41F] px-6 py-2 rounded-[16px] font-bold text-slate-900 hover:opacity-90"
    >
      {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</div>

<div class="bg-white rounded-[16px] shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-[#FAB41F] font-bold text-slate-900">
      <tr>
        <th class="p-4 text-left">ID</th>
        <th class="p-4 text-left">Nombre de Unidad</th>
        <th class="p-4 text-left">Abreviatura</th>
        <th class="p-4 text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let unidad of unidades" class="border-t hover:bg-slate-50">
        <td class="p-4 font-bold text-slate-500">
          #{{ unidad.id_unidad_medida }}
        </td>
        <td class="p-4 font-semibold text-slate-800">
          {{ unidad.nombre_unidad }}
        </td>
        <td class="p-4">
          <span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold text-xs">
            {{ unidad.abreviatura || 'N/A' }}
          </span>
        </td>
        <td class="p-4 text-center">
          <div class="flex justify-center gap-2">
            <button
              type="button"
              (click)="editarUnidad(unidad)"
              class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold hover:bg-slate-100"
            >
              ✏️ Editar
            </button>
            <button
              type="button"
              (click)="eliminarUnidad(unidad)"
              class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-600 hover:bg-red-100"
            >
              🗑️ Eliminar
            </button>
          </div>
        </td>
      </tr>

      <tr *ngIf="unidades.length === 0">
        <td colspan="4" class="p-6 text-center text-slate-400">
          No hay unidades de medida registradas.
        </td>
      </tr>
    </tbody>
  </table>
</div>
