<div class="max-w-7xl mx-auto space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-black">Productos</h1>
    <a routerLink="/nuevo-producto" class="bg-[#FAB41F] px-5 py-2 rounded-[16px] font-bold text-slate-900">+ Nuevo producto</a>
  </div>

  <div class="bg-white p-6 rounded-[16px] shadow mb-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-xl font-black">{{ modoEdicion ? 'Actualizar producto' : 'Registrar producto' }}</h2>
      <button *ngIf="modoEdicion" type="button" (click)="abrirFormulario()" class="border px-3 py-1 rounded-lg text-sm">Cancelar</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input [(ngModel)]="productoForm.nombre" class="border p-3 rounded-[16px]" placeholder="Nombre del producto">
      <input [(ngModel)]="productoForm.categoria" class="border p-3 rounded-[16px]" placeholder="Categoría">
      <input type="number" [(ngModel)]="productoForm.stock" class="border p-3 rounded-[16px]" placeholder="Stock">
    </div>

    <div class="flex justify-end mt-4">
      <button type="button" (click)="guardarProducto()" class="bg-[#FAB41F] px-6 py-2 rounded-[16px] font-bold text-slate-900">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </div>

  <div class="bg-white border rounded-2xl p-6 shadow-sm grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
    <div *ngFor="let p of productos" class="border rounded-xl p-4 shadow-sm">
      <p class="font-bold text-lg">{{ p.nombre }}</p>
      <p class="text-xs text-gray-500">{{ p.categoria }}</p>
      <p class="text-sm mt-3">Stock: {{ p.stock }}</p>
      <div class="flex gap-2 mt-4">
        <button type="button" (click)="editarProducto(p)" class="rounded-lg border border-slate-200 bg-slate-50 px-3 py-1 text-xs font-semibold">✏️ Editar</button>
        <button type="button" (click)="eliminarProducto(p)" class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-600">🗑️ Eliminar</button>
      </div>
    </div>
  </div>
</div>
